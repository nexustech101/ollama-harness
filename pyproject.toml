[project]
name = "ollama-harness"
version = "0.1.0"
description = "A small coding agent for local Ollama models, with an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness.py", "tools.py", "api.py", "main.py"]
sources = ["."]
