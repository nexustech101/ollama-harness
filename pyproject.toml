[project]
name = "ollama-harness"
version = "0.3.0"
description = "A small coding agent with pluggable model providers (ollama, openai, openrouter) and an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
check = [
    "mypy>=1.11",
    "ruff>=0.6",
]
dev = ["pytest>=8"]

[project.scripts]
harness = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness.py", "providers.py", "tools.py", "api.py", "main.py",
                 "cli.py", "providers.example.yaml", "domain", "workspace",
                 "providers", "server"]
sources = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true