[project]
name = "ollama-harness"
version = "0.2.0"
description = "A small coding agent with pluggable model providers (ollama, openai, openrouter) and an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness.py", "providers.py", "tools.py", "api.py", "main.py"]
sources = ["."]
