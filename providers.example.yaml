# Named providers for the harness. This file is read ONLY when you pass
# --provider NAME (e.g. `harness --provider openrouter`). Without --provider
# the harness always uses ollama, configured from .env.
#
# Copy this file to `providers.yaml` in your working directory (or
# ~/.config/harness/providers.yaml, %APPDATA%\harness\providers.yaml) and fill
# in your values. `harness init-provider` creates it interactively; this file
# is the reference template.
#
# Fields per provider:
#   base_url   API endpoint (required)
#   api_key    secret for that service (leave out to use env vars instead)
#   model      default model id (can be overridden with --model per run)
#   kind       wire protocol: openai (default for custom names), ollama,
#              or openrouter. A name that matches a built-in inherits it.
#   num_ctx    context window (ollama only)
#
# The default provider (no --provider) is ALWAYS ollama.

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: sk-or-v1-xxxxxxxxxxxxxxxx
    model: openai/gpt-5.5

